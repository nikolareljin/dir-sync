name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish."
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller
      - name: Build executable
        run: |
          pyinstaller --noconfirm --name dir-sync --onefile --windowed --copy-metadata dir-sync --workpath .pyinstaller-build --specpath .pyinstaller-spec src/dirsync/app.py
      - name: Package artifact
        shell: bash
        env:
          ARTIFACT: dir-sync-${{ matrix.os }}
        run: |
          python - <<'PY'
          import os
          import shutil
          shutil.make_archive(os.environ["ARTIFACT"], "zip", "dist")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dir-sync-${{ matrix.os }}
          path: dir-sync-${{ matrix.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/**
