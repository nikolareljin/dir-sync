name: Release Tag Guard

on:
  pull_request:
  push:
    branches: [main, master, "release/*"]

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  release_guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Guard release tag
        id: release_guard
        uses: nikolareljin/ci-helpers/.github/actions/check-release-tag@production

        with:
          release_branch: ${{ github.head_ref || github.ref_name }}
          fetch_tags: true

  auto_tag_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      update_production_tag: false
      release_workflow: release.yml
